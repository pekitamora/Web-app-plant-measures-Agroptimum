<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mediciones">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Mediciones de plantas</title>
<style>
:root{
  --brand:#299241; --brand-d:#1f7a36; --brand-dd:#14532d; --brand-50:#edf7ef; --brand-100:#d5ecd9;
  --bg:#f3f5f4; --card:#fff; --ink:#17221b; --muted:#5e6a63; --line:#dde3df; --line2:#c9d1cc;
  --amber:#a15c00; --amberbg:#fff4e0; --red:#b42318; --redbg:#fdecea;
  --r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hbar{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:760px;margin:0 auto}
.hbar img{width:40px;height:40px;border-radius:9px;border:1px solid var(--line);flex:none}
.hbar h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.1px;color:var(--brand-dd);line-height:1.15}
.hbar h1 span{display:block;font-size:12.5px;font-weight:500;color:var(--muted);letter-spacing:.2px}
#estado{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;padding:7px 16px;background:var(--brand-50);color:var(--brand-dd);border-top:3px solid var(--brand)}
#estado .dot{width:9px;height:9px;border-radius:50%;background:var(--brand);flex:none}
#estado.off{background:var(--amberbg);color:#6b3d00;border-top-color:#e09a2b} #estado.off .dot{background:#e09a2b}
#estado.err{background:var(--redbg);color:var(--red);border-top-color:var(--red)} #estado.err .dot{background:var(--red)}
main{padding:16px 14px 112px;max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:9px 4px 11px;font-size:13px;font-weight:600;color:var(--muted);position:relative;letter-spacing:.2px}
nav button svg{display:block;margin:0 auto 3px;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--brand-d)}
nav button.on::before{content:"";position:absolute;top:-1px;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
nav button .badge{position:absolute;top:5px;left:calc(50% + 8px);min-width:18px;padding:0 5px;border-radius:9px;background:var(--amber);color:#fff;font-size:11px;line-height:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.lbl{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 8px;text-transform:uppercase;letter-spacing:.6px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
input[type=date]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none}
.row input[type=date]{font-size:17px;padding:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.btn{display:block;width:100%;min-height:56px;border-radius:8px;border:1px solid var(--line2);background:#fff;font-weight:700;font-size:17px;padding:8px 10px;text-align:center;color:var(--ink)}
.btn small{display:block;font-weight:500;font-size:12.5px;color:var(--muted);margin-top:1px}
.btn.sel{border:2px solid var(--brand);background:var(--brand-50);color:var(--brand-dd);padding:7px 9px}
.btn.pri{background:var(--brand-d);border-color:var(--brand-d);color:#fff;min-height:62px;font-size:18px;letter-spacing:.2px}
.btn.pri:active{background:var(--brand-dd)}
.btn.sec{border-color:var(--brand-d);color:var(--brand-d)}
.btn.dan{border-color:var(--red);color:var(--red)}
.btn.done{border-color:var(--brand-100);background:#f8fcf8}
.btn.done small{color:var(--brand-d);font-weight:700}
.btn:disabled{opacity:.45}
.mt{margin-top:10px}
input.big,select.big{width:100%;min-height:52px;border:1px solid var(--line2);border-radius:8px;padding:8px 12px;background:#fff;font-size:18px}
input.num{width:100%;min-height:64px;border:1px solid var(--line2);border-radius:8px;padding:6px 14px;font-size:30px;font-weight:700;background:#fff;font-variant-numeric:tabular-nums}
input.big:focus,input.num:focus,textarea:focus,select.big:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-100)}
textarea{width:100%;min-height:70px;border:1px solid var(--line2);border-radius:8px;padding:10px;font-size:17px}
.field{margin-bottom:18px}
.field:last-child{margin-bottom:0}
.field .lbl{font-size:15px;text-transform:none;letter-spacing:0;color:var(--ink)}
.field .lbl span{color:var(--muted);font-weight:500}
.prev{font-size:14px;color:var(--muted);margin-top:5px;min-height:20px}
.prev b{color:var(--ink)}
.prev .warn{color:var(--amber);font-weight:700}
.zhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.zhead h2{margin:0;font-size:21px;color:var(--brand-dd)}
.link{border:0;background:none;color:var(--brand-d);font-weight:700;padding:10px 0;font-size:15px;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--brand)}
.plant{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;border:1px solid var(--line);border-left:4px solid var(--line2);border-radius:8px;background:#fff;padding:8px 12px;margin-bottom:6px;text-align:left}
.plant .ck{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff}
.plant.done{border-left-color:var(--brand)}
.plant.done .ck{background:var(--brand);border-color:var(--brand)}
.plant .id{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.plant .sm{font-size:13.5px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:4px;background:var(--amberbg);color:var(--amber);margin-left:6px;text-transform:uppercase;letter-spacing:.4px;vertical-align:2px}
.tag.ok{background:var(--brand-50);color:var(--brand-d)}
.tag.red{background:var(--redbg);color:var(--red)}
.tog{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tog .btn.sel.si{border-color:var(--red);background:var(--redbg);color:var(--red)}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.list .it:last-child{border-bottom:0}
.muted{color:var(--muted);font-size:14px}
.note{background:var(--amberbg);color:#5a3500;border:1px solid #f3d9a8;border-radius:8px;padding:10px 12px;font-size:14.5px;margin-bottom:12px}
.note.g{background:var(--brand-50);color:var(--brand-dd);border-color:var(--brand-100)}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--brand-dd);color:#fff;padding:11px 18px;border-radius:8px;font-weight:600;font-size:15px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#toast.show{opacity:1}
#modal{position:fixed;inset:0;background:rgba(15,25,19,.5);z-index:30;display:none;align-items:flex-end;justify-content:center}
#modal.show{display:flex}
#modal .box{background:#fff;width:100%;max-width:760px;border-radius:14px 14px 0 0;padding:20px 16px calc(18px + env(safe-area-inset-bottom));border-top:4px solid var(--brand)}
#modal h3{margin:0 0 10px;font-size:19px;color:var(--brand-dd)}
#modal ul{margin:0 0 14px;padding-left:20px;font-size:16px}
#modal li{margin-bottom:6px}
.chk{display:flex;align-items:center;gap:12px;min-height:46px;font-size:16px}
.chk input{width:22px;height:22px;accent-color:var(--brand-d)}
h3.sec{font-size:15px;margin:0 0 12px;color:var(--brand-dd)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{min-height:46px;min-width:60px;border-radius:8px;border:1px solid var(--line2);background:#fff;font-weight:700;font-size:15px;padding:4px 12px}
.chip small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.chip.sel{border:2px solid var(--brand);background:var(--brand-50);color:var(--brand-dd);padding:3px 11px}
.chip.done small{color:var(--brand-d);font-weight:700}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:18px}
</style>
</head>
<body>
<header>
  <div class="hbar"><img src="logo.png" alt=""><h1>Mediciones de plantas<span>Indicadores semanales de vivero</span></h1></div>
  <div id="estado"><span class="dot"></span><span id="estadoTxt">Cargando…</span></div>
</header>
<main id="main"></main>
<nav>
  <button data-nav="medir"><svg viewBox="0 0 24 24"><rect x="2.5" y="7.5" width="19" height="9" rx="1.5"/><path d="M6.5 7.5v3M10 7.5v4.5M13.5 7.5v3M17 7.5v4.5"/></svg>Medir</button>
  <button data-nav="datos"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Datos<span id="navBadge"></span></button>
  <button data-nav="ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</button>
</nav>
<div id="toast"></div>
<div id="modal"><div class="box" id="modalBox"></div></div>

<script>
/* =====================================================================
   CONFIGURACIÓN DEL VIVERO  ·  edita aquí zonas, plantas y límites
   ===================================================================== */
const CONFIG = {
  campanaPorDefecto: '26-27',
  inicioCampanaPorDefecto: '2026-11-09',   // la fecha que usa la fórmula "Semana campaña" del Excel
  viveros: [
    { id: 'V1', nombre: 'Vivero 1' },
    { id: 'V2', nombre: 'Vivero 2' },
    { id: 'V3', nombre: 'Vivero 3' },
    { id: 'CAMPAS', nombre: 'Campas' },
    { id: 'Proyectos', nombre: 'Proyectos' },
  ],
  // [vivero, zona, sectores de riego]  (copiado de la hoja ZONAS)
  zonas: [
    ['V1','1AC','1-27, 1-28, 1-29, 1-30'], ['V1','1AN','1-35, 1-36'], ['V1','2AC','1-31'], ['V1','2AN','1-34'],
    ['V1','3AC','1-32'], ['V1','3AN','1-33'],
    ['V2','1','2-1, 2-2'], ['V2','2','2-3, 2-4'], ['V2','3','2-5, 2-6'], ['V2','4','2-7, 2-8'],
    ['V2','5','2-15, 2-16'], ['V2','6','2-13, 2-14'], ['V2','7','2-11, 2-12'], ['V2','8','2-9, 2-10'],
    ['V3','1BC','3-29'], ['V3','1BN','3-39'], ['V3','2BC','3-31'], ['V3','2BN','3-37'], ['V3','3BC','3-33'], ['V3','3BN','3-35'],
    ['V3','VIVERO 3B','3B-41, 3B-42'],
    ['CAMPAS','CAMPA 1A','1-39, 1-40'], ['CAMPAS','EXPLANADA ERA','1-37'], ['CAMPAS','EXP ERA S6','1-6'],
    ['CAMPAS','EXP ERA S10','1-10'], ['CAMPAS','EXP 2B S26','2-26'],
    ['Proyectos','LEV2050',''],
  ],
  // Plantas indicadoras de cada zona: [ID, sector] o solo 'ID' si no tiene sector
  plantas: {
    'V1 · 3AC': [['A2CF5S2 1.1',32],['A2CF5S2 1.2',32],['A3CF5S3 1.1',32],['A3CF5S3 1.2',32],
                 ['A4CF5S4 1.1',32],['A4CF5S4 1.2',32],['A5CF5S5 1.1',32],['A5CF5S5 1.2',32]],
    'V1 · 3AN': [['A2NF5S2 1.1',33],['A2NF5S2 1.2',33],['A3NF5S3 1.1',33],['A3NF5S3 1.2',33],
                 ['A4NF5S4 1.1',33],['A4NF5S4 1.2',33],['A5NF5S5 1.1',33],['A5NF5S5 1.2',33]],
    'Proyectos · LEV2050': [
      'F1Z1-1','F1Z1-2','F1Z1-3','F1Z2-1','F1Z2-2','F1Z2-3','F1Z3-1','F1Z3-2','F1Z3-3','F1Z4-1','F1Z4-2','F1Z4-3',
      'F2Z1-1','F2Z1-2','F2Z1-3','F2Z2-1','F2Z2-2','F2Z2-3','F2Z3-1','F2Z3-2','F2Z3-3','F2Z4-1','F2Z4-2','F2Z4-3',
      'F3Z1-1','F3Z1-2','F3Z1-3','F3Z2-1','F3Z2-2','F3Z2-3','F3Z3-1','F3Z3-2','F3Z3-3','F3Z4-1','F3Z4-2','F3Z4-3',
      'F4Z1-1','F4Z1-2','F4Z1-3','F4Z2-1','F4Z2-2','F4Z2-3','F4Z3-1','F4Z3-2','F4Z3-3','F4Z4-1','F4Z4-2','F4Z4-3',
      'F5Z1-1','F5Z1-2','F5Z1-3','F5Z2-1','F5Z2-2','F5Z2-3','F5Z3-1','F5Z3-2','F5Z3-3','F5Z4-1','F5Z4-2','F5Z4-3',
      'F6Z1-1','F6Z1-2','F6Z1-3','F6Z2-1','F6Z2-2','F6Z2-3','F6Z3-1','F6Z3-2','F6Z3-3','F6Z4-1','F6Z4-2','F6Z4-3',
      'F7Z1-1','F7Z1-2','F7Z1-3','F7Z2-1','F7Z2-2','F7Z2-3','F7Z3-1','F7Z3-2','F7Z3-3','F7Z4-1','F7Z4-2','F7Z4-3',
      'F8Z1-1','F8Z1-2','F8Z1-3','F8Z2-1','F8Z2-2','F8Z2-3','F8Z3-1','F8Z3-2','F8Z3-3','F8Z4-1','F8Z4-2','F8Z4-3',
      'F9Z1-1','F9Z1-2','F9Z1-3','F9Z2-1','F9Z2-2','F9Z2-3','F9Z3-1','F9Z3-2','F9Z3-3','F9Z4-1','F9Z4-2','F9Z4-3'],
  },
  // Mediciones ya apuntadas en el Excel (solo sirven para comparar con la semana anterior; no se exportan)
  historico: [
    ['V1 · 3AC','2026-11-09',{'A2CF5S2 1.1':7,'A2CF5S2 1.2':4,'A3CF5S3 1.1':5.5,'A3CF5S3 1.2':9,'A4CF5S4 1.1':11,'A4CF5S4 1.2':7.5,'A5CF5S5 1.1':6.3,'A5CF5S5 1.2':8.9}],
    ['V1 · 3AN','2026-11-09',{'A2NF5S2 1.1':7,'A2NF5S2 1.2':9.1,'A3NF5S3 1.1':4.5,'A3NF5S3 1.2':3.5,'A4NF5S4 1.1':5.5,'A4NF5S4 1.2':5.5,'A5NF5S5 1.1':6.5,'A5NF5S5 1.2':7.5}],
    ['V1 · 3AC','2026-11-16',{'A2CF5S2 1.1':9.5,'A2CF5S2 1.2':5.7,'A3CF5S3 1.1':6,'A3CF5S3 1.2':11,'A4CF5S4 1.1':11,'A4CF5S4 1.2':9,'A5CF5S5 1.1':7,'A5CF5S5 1.2':8.9}],
    ['V1 · 3AN','2026-11-16',{'A2NF5S2 1.1':7,'A2NF5S2 1.2':10,'A3NF5S3 1.1':9.3,'A3NF5S3 1.2':4.5,'A4NF5S4 1.1':5.5,'A4NF5S4 1.2':6.4,'A5NF5S5 1.1':7.2,'A5NF5S5 1.2':8.3}],
  ],
  // Campos que se miden y límites para avisar de valores raros
  campos: [
    { k:'altura_ucb',     label:'Altura UCB',           u:'cm', max:250, subidaSemana:25, bajada:1   },
    { k:'altura_lign',    label:'Altura lignificación', u:'cm', max:250, subidaSemana:25, bajada:1   },
    { k:'diametro70',     label:'Diámetro a 70 cm',     u:'mm', max:15,  subidaSemana:3,  bajada:0.5 },
    { k:'altura_injerto', label:'Altura injerto',       u:'cm', max:120, subidaSemana:20, bajada:1   },
  ],
};
/* ===================================================================== */

const LS = {
  get(k, d){ try{ const v = localStorage.getItem('viv_'+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('viv_'+k, JSON.stringify(v)); }catch(e){} },
};
let cfg = Object.assign({
  nombre:'', campana:CONFIG.campanaPorDefecto, inicio:CONFIG.inicioCampanaPorDefecto,
  url:'', clave:'', campos:{altura_ucb:true, altura_lign:true, diametro70:true, altura_injerto:true},
}, LS.get('cfg', {}));
let dispositivo = LS.get('dispositivo', null);
if(!dispositivo){ dispositivo = 'm-' + Math.random().toString(36).slice(2,8); LS.set('dispositivo', dispositivo); }
const saveCfg = () => LS.set('cfg', cfg);

/* ---------- almacenamiento local (IndexedDB, con plan B en localStorage) ---------- */
const Store = {
  db:null, mode:'idb',
  open(){
    return new Promise(res => {
      try{
        const r = indexedDB.open('vivero', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('rec', {keyPath:'uuid'});
        r.onsuccess = () => { this.db = r.result; res(); };
        r.onerror = () => { this.mode='ls'; res(); };
      }catch(e){ this.mode='ls'; res(); }
    });
  },
  all(){
    if(this.mode==='ls') return Promise.resolve(LS.get('records', []));
    return new Promise((res, rej) => {
      const q = this.db.transaction('rec').objectStore('rec').getAll();
      q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
    });
  },
  put(list){
    if(this.mode==='ls'){ LS.set('records', records); return Promise.resolve(); }
    return new Promise((res, rej) => {
      const tx = this.db.transaction('rec', 'readwrite'); const st = tx.objectStore('rec');
      list.forEach(r => st.put(r));
      tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
    });
  },
};

let records = [];               // todas las mediciones (de este móvil y, si hay Google Sheets, de todos)
let extras = LS.get('plantasExtra', {});   // plantas añadidas a mano: {etiqueta: [[id, sector], ...]}
let zonaInfo = LS.get('zonaInfo', {});     // {campana|etiqueta: {fechaInjerto}}
let S = { view:'medir', vivero:null, etiqueta:null, fecha:hoy(), planta:null };
let sync = { estado:'idle', error:'', ultima:LS.get('ultimaSync', null), ultimaBajada:0 };

/* ---------- utilidades ---------- */
function pad(n){ return String(n).padStart(2,'0'); }
function hoy(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function dUTC(s){ const [y,m,d]=s.split('-').map(Number); return Date.UTC(y,m-1,d); }
function dias(a,b){ return Math.round((dUTC(b)-dUTC(a))/86400000); }
function sumaDias(s,n){ const d=new Date(dUTC(s)+n*86400000); return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate()); }
const DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
function fFecha(s){ if(!s) return ''; const d=new Date(dUTC(s)); return DIAS[d.getUTCDay()]+' '+pad(d.getUTCDate())+'/'+pad(d.getUTCMonth()+1); }
function num(s){ if(s==null||s==='') return NaN; return Number(String(s).trim().replace(/\s/g,'').replace(',','.')); }
function fN(n){ return (n==null||n==='') ? '' : String(Math.round(Number(n)*100)/100).replace('.',','); }
function esc(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uuid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'u'+Date.now().toString(36)+Math.random().toString(36).slice(2)); }
function etiq(v,z){ return v+' · '+z; }
function sectoresDe(et){
  const z = CONFIG.zonas.find(z => etiq(z[0],z[1])===et);
  return z ? z[2].split(',').map(s => parseInt(s.split('-').pop(), 10)).filter(n => !isNaN(n)) : [];
}
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'), 2200); }
function modal(html){ document.getElementById('modalBox').innerHTML=html; document.getElementById('modal').classList.add('show'); }
function cerrarModal(){ document.getElementById('modal').classList.remove('show'); }
const vivos = () => records.filter(r => !r.borrado && r.campana===cfg.campana);

/* ---------- datos de plantas y mediciones ---------- */
function plantasDe(et){
  const out=[], seen=new Set();
  const add=(id,sector,extra)=>{ id=String(id).trim(); if(!id||seen.has(id)) return; seen.add(id); out.push({id,sector,extra}); };
  (CONFIG.plantas[et]||[]).forEach(p=>Array.isArray(p)?add(p[0],p[1]??'',false):add(p,'',false));
  (extras[et]||[]).forEach(p=>add(p[0],p[1],true));
  vivos().filter(r=>r.etiqueta===et && !r.historico).sort((a,b)=>a.id.localeCompare(b.id)).forEach(r=>add(r.id,r.sector,false));
  return out;
}
function medicionDe(et,id,fecha){
  const l = vivos().filter(r=>r.etiqueta===et && r.id===id && r.fecha===fecha && !r.historico);
  l.sort((a,b)=>(b.actualizado||'').localeCompare(a.actualizado||''));
  return { rec:l[0]||null, n:l.length };
}
function anteriorDe(et,id,fecha){
  const l = vivos().filter(r=>r.etiqueta===et && r.id===id && r.fecha<fecha);
  l.sort((a,b)=>b.fecha.localeCompare(a.fecha) || (b.actualizado||'').localeCompare(a.actualizado||''));
  return l[0]||null;
}
function cargarHistorico(){
  CONFIG.historico.forEach(([et,fecha,vals])=>{
    const [v,z]=et.split(' · ');
    Object.entries(vals).forEach(([id,ucb])=>{
      const u='hist|'+et+'|'+id+'|'+fecha;
      if(records.some(r=>r.uuid===u)) return;
      records.push({uuid:u, historico:true, synced:true, id, vivero:v, zona:z, etiqueta:et, campana:CONFIG.campanaPorDefecto,
        fecha, altura_ucb:ucb, sector:(CONFIG.plantas[et].find(p=>p[0]===id)||[])[1]||'', actualizado:'2000-01-01'});
    });
  });
}

/* ---------- comprobación de valores raros ---------- */
function revisar(vals, ant, fecha){
  const avisos=[];
  CONFIG.campos.forEach(c=>{
    const v=vals[c.k]; if(v==null) return;
    if(v>c.max) avisos.push(`<b>${c.label}</b>: ${fN(v)} ${c.u} es más de lo normal (máx. ${c.max} ${c.u}).`);
    const p = ant ? num(ant[c.k]) : NaN;
    if(!isNaN(p)){
      const d=Math.max(dias(ant.fecha,fecha),1), sem=Math.max(d/7,0.5), dif=v-p;
      if(dif < -c.bajada) avisos.push(`<b>${c.label}</b> ha bajado: ${fN(p)} → ${fN(v)} ${c.u}.`);
      else if(dif/sem > c.subidaSemana){
        let t=`<b>${c.label}</b> ha subido ${fN(dif)} ${c.u} en ${d} días (${fN(p)} → ${fN(v)}).`;
        if(p>0 && v/p>=8 && v/p<=12) t+=' ¿Falta una coma?';
        avisos.push(t);
      }
    }
  });
  if(vals.altura_lign!=null && vals.altura_ucb!=null && vals.altura_lign>vals.altura_ucb)
    avisos.push('La <b>altura de lignificación</b> es mayor que la <b>altura UCB</b>.');
  return avisos;
}

/* ---------- pantallas ---------- */
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.nav===(S.view==='form'?'medir':S.view)));
  const m=document.getElementById('main');
  m.innerHTML = S.view==='form' ? vForm() : S.view==='datos' ? vDatos() : S.view==='ajustes' ? vAjustes() : vMedir();
  pintarEstado();
  if(S.view==='form') prepararForm();
  if(S.view==='datos') contarExport();
}

function vMedir(){
  let h = avisoInstalar();
  h += `<div class="card"><label class="lbl" for="fecha">Fecha de medición</label>
    <div class="row"><input class="big grow" type="date" id="fecha" value="${S.fecha}" data-ch="fecha">
    <div style="min-width:80px;font-weight:700">${fFecha(S.fecha)}</div></div></div>`;
  if(!S.etiqueta){
    h += `<div class="card"><span class="lbl">Vivero o proyecto</span><div class="seg">` +
      CONFIG.viveros.map(v=>`<button class="btn ${S.vivero===v.id?'sel':''}" data-act="vivero" data-v="${esc(v.id)}">${esc(v.id)}${v.nombre!==v.id?'<small>'+esc(v.nombre)+'</small>':''}</button>`).join('') +
      `</div></div>`;
    if(S.vivero){
      h += `<div class="card"><span class="lbl">Zona</span><div class="grid">` +
        CONFIG.zonas.filter(z=>z[0]===S.vivero).map(z=>{
          const et=etiq(z[0],z[1]), pl=plantasDe(et), hechas=pl.filter(p=>medicionDe(et,p.id,S.fecha).rec).length;
          const cls = pl.length && hechas===pl.length ? 'btn done' : 'btn';
          return `<button class="${cls}" data-act="zona" data-et="${esc(et)}">${esc(z[1])}<small>${pl.length ? (hechas===pl.length?'✓ ':'')+hechas+'/'+pl.length : 'sin plantas'}</small></button>`;
        }).join('') + `</div></div>`;
    }
    return h;
  }
  const et=S.etiqueta, pl=plantasDe(et);
  const hechas=pl.filter(p=>medicionDe(et,p.id,S.fecha).rec).length;
  const zi=zonaInfo[cfg.campana+'|'+et]||{};
  h += `<div class="card"><div class="zhead"><h2>${esc(et)}</h2><button class="link" data-act="cambiarZona">← Cambiar zona</button></div>
    <div class="muted">${hechas} de ${pl.length} plantas medidas el ${fFecha(S.fecha)}</div>
    <div class="bar"><i style="width:${pl.length?Math.round(hechas/pl.length*100):0}%"></i></div>
    <label class="lbl mt" for="finj">Fecha de injerto de la zona (opcional)</label>
    <input class="big" type="date" id="finj" value="${zi.fechaInjerto||''}" data-ch="finj"></div>`;
  // Si la zona tiene muchas plantas tipo F1Z1-1, se agrupan por F1, F2… para no tener una lista enorme
  const grupoDe = id => (String(id).match(/^(F\d+)Z/i)||[])[1];
  const grupos = [...new Set(pl.map(p=>grupoDe(p.id)).filter(Boolean))];
  let lista = pl;
  if(pl.length>20 && grupos.length>1){
    if(S.grupo && !grupos.includes(S.grupo)) S.grupo=null;
    h += `<div class="chips"><button class="chip ${!S.grupo?'sel':''}" data-act="grupo" data-g="">Todas<small>${hechas}/${pl.length}</small></button>` +
      grupos.map(g=>{ const pg=pl.filter(p=>grupoDe(p.id)===g), hg=pg.filter(p=>medicionDe(et,p.id,S.fecha).rec).length;
        return `<button class="chip ${S.grupo===g?'sel':''} ${hg===pg.length?'done':''}" data-act="grupo" data-g="${g}">${g}<small>${hg===pg.length?'✓ ':''}${hg}/${pg.length}</small></button>`; }).join('') + `</div>`;
    if(S.grupo) lista = pl.filter(p=>grupoDe(p.id)===S.grupo);
  }
  if(!pl.length) h += `<div class="note">Esta zona todavía no tiene plantas indicadoras. Añádelas con el botón de abajo (pon el mismo ID que usáis en el Excel).</div>`;
  h += lista.map(p=>{
    const {rec,n}=medicionDe(et,p.id,S.fecha);
    let res='Pendiente';
    if(rec){
      res = CONFIG.campos.filter(c=>rec[c.k]!=null&&rec[c.k]!=='').map(c=>c.label.replace('Altura ','').replace('Diámetro a 70 cm','Ø70')+' '+fN(rec[c.k])).join(' · ') || 'Solo comentario';
      if(rec.enfermedad==='Sí') res += ' · Enfermedad';
    }
    return `<button class="plant ${rec?'done':''}" data-act="planta" data-id="${esc(p.id)}">
      <span class="ck">${rec?'✓':''}</span>
      <span class="grow"><span class="id">${esc(p.id)}</span>${n>1?'<span class="tag">'+n+' mediciones</span>':''}${rec&&!rec.synced&&cfg.url?'<span class="tag">sin enviar</span>':''}
      <br><span class="sm">${p.sector!==''&&p.sector!=null?'Sector '+esc(p.sector)+' · ':''}${esc(res)}</span></span>
      ${p.extra && !vivos().some(r=>r.etiqueta===et&&r.id===p.id) ? `<span data-act="quitarPlanta" data-id="${esc(p.id)}" style="padding:10px;font-size:20px;color:var(--muted)">✕</span>`:''}
    </button>`;
  }).join('');
  h += `<button class="btn sec mt" data-act="nuevaPlanta">+ Añadir planta</button>`;
  return h;
}

function vForm(){

  const {rec}=medicionDe(et,p.id,S.fecha), ant=anteriorDe(et,p.id,S.fecha);
  let h=`<div class="zhead"><button class="link" data-act="volver">← Volver</button><span class="muted">${esc(et)}${p.sector!==''&&p.sector!=null?' · sector '+esc(p.sector):''}</span></div>
    <div class="card"><h2 style="margin:0 0 2px;font-size:26px">${esc(p.id)}</h2>
    <div class="muted">${fFecha(S.fecha)}${rec?' · <b>editando</b>':''}${ant?' · anterior: '+fFecha(ant.fecha):' · sin medición anterior'}</div></div><div class="card">`;
  CONFIG.campos.filter(c=>cfg.campos[c.k]!==false).forEach(c=>{
    const v = rec && rec[c.k]!=null ? fN(rec[c.k]) : '';
    const pv = ant && ant[c.k]!=null && ant[c.k]!=='' ? fN(ant[c.k])+' '+c.u : null;
    h+=`<div class="field"><label class="lbl" for="f_${c.k}">${c.label} <span>(${c.u})</span></label>
      <input class="num" id="f_${c.k}" data-k="${c.k}" inputmode="decimal" autocomplete="off" enterkeyhint="next" value="${v}" placeholder="—">
      <div class="prev" id="p_${c.k}">${pv?'Anterior: <b>'+pv+'</b>':''}</div></div>`;
  });
  const enf = rec ? rec.enfermedad : 'No';
  h+=`<div class="field"><span class="lbl">Enfermedad</span><div class="tog">
      <button class="btn ${enf!=='Sí'?'sel':''}" data-act="enf" data-v="No">No</button>

    <div class="field"><label class="lbl" for="f_com">Comentarios</label><textarea id="f_com">${esc(rec?rec.comentarios:'')}</textarea></div></div>
    <button class="btn pri" data-act="guardar" data-next="1">Guardar y siguiente →</button>
    <button class="btn sec mt" data-act="guardar">Guardar y volver a la zona</button>
    ${rec?'<button class="btn dan mt" data-act="borrar">Borrar esta medición</button>':''}`;
  S._enf = enf; S._ant = ant;
  return h;
}
function prepararForm(){
  const inputs=[...document.querySelectorAll('input.num')];
  inputs.forEach((el,i)=>{
    el.addEventListener('input',()=>pistaCampo(el));
    el.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); (inputs[i+1]||document.getElementById('f_com')).focus(); }});
  });
  const first=inputs.find(i=>!i.value); if(first && !('ontouchstart' in window)) first.focus();
}
function pistaCampo(el){
  const c=CONFIG.campos.find(c=>c.k===el.dataset.k), ant=S._ant, box=document.getElementById('p_'+c.k);
  const v=num(el.value), pv=ant?num(ant[c.k]):NaN;
  let t = !isNaN(pv) ? 'Anterior: <b>'+fN(pv)+' '+c.u+'</b>' : '';
  if(el.value.trim()!=='' && isNaN(v)) t += ' <span class="warn">· no es un número</span>';
  else if(!isNaN(v) && !isNaN(pv) && el.value.trim()!==''){
    const dif=v-pv, raro = revisar({[c.k]:v}, ant, S.fecha).length>0;
    t += ` → <span class="${raro?'warn':''}">${dif>=0?'+':''}${fN(dif)} ${c.u}${raro?' · revisar':''}</span>`;
  } else if(!isNaN(v) && v>c.max) t += ' <span class="warn">valor alto</span>';
  box.innerHTML=t;
}

  const g={};
  vs.forEach(r=>{ const k=r.fecha+'|'+r.etiqueta; (g[k]=g[k]||{fecha:r.fecha,et:r.etiqueta,n:0,p:0,ids:new Set()}); g[k].n++; g[k].ids.add(r.id); if(!r.synced) g[k].p++; });
  const grupos=Object.values(g).sort((a,b)=>b.fecha.localeCompare(a.fecha)||a.et.localeCompare(b.et));

      <span><b>${fFecha(x.fecha)}</b> · ${esc(x.et)}<br><span class="muted">${x.ids.size} plantas${x.n>x.ids.size?' · '+(x.n-x.ids.size)+' repetidas':''}</span></span>

  return h;
}

/* ---------- instalar como app ---------- */
let installEvt=null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); installEvt=e; if(S.view!=='form') render(); });
function avisoInstalar(siempre){
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if(standalone || (!siempre && LS.get('ocultarInstalar',false))) return '';
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(installEvt) return `<div class="note g"><b>Instala la app</b> para usarla sin internet.<button class="btn sec mt" data-act="instalar">Instalar en este móvil</button>${siempre?'':'<button class="link" data-act="ocultarInst">Ahora no</button>'}</div>`;
  if(ios) return `<div class="note g"><b>Para usarla sin internet:</b> pulsa <b>Compartir</b> (□↑) y luego <b>«Añadir a pantalla de inicio»</b>. Abre siempre la app desde ese icono.${siempre?'':'<br><button class="link" data-act="ocultarInst">Entendido</button>'}</div>`;
  return '';
}

/* ---------- acciones ---------- */
document.addEventListener('click', async e=>{
  const nav=e.target.closest('[data-nav]');
  if(nav){ S.view=nav.dataset.nav; if(S.view==='medir'&&S.planta) S.planta=null; render(); scrollTo(0,0); return; }
  if(e.target.id==='modal'){ cerrarModal(); return; }
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act;
  if(a==='vivero'){ S.vivero=b.dataset.v; render(); }
  else if(a==='zona'){ S.etiqueta=b.dataset.et; S.grupo=null; render(); scrollTo(0,0); }
  else if(a==='grupo'){ S.grupo=b.dataset.g||null; render(); }
  else if(a==='cambiarZona'){ S.etiqueta=null; render(); }
  else if(a==='quitarPlanta'){ e.stopPropagation(); const id=b.dataset.id; extras[S.etiqueta]=(extras[S.etiqueta]||[]).filter(p=>p[0]!==id); LS.set('plantasExtra',extras); render(); }
  else if(a==='planta'){ S.planta=b.dataset.id; S.view='form'; render(); scrollTo(0,0); }
  else if(a==='volver'){ S.view='medir'; S.planta=null; render(); }
  else if(a==='enf'){ S._enf=b.dataset.v; document.querySelectorAll('[data-act=enf]').forEach(x=>x.classList.toggle('sel',x===b)); }
  else if(a==='guardar'){ guardar(!!b.dataset.next, false); }
  else if(a==='forzar'){ cerrarModal(); guardar(S._next, true); }
  else if(a==='cerrar'){ cerrarModal(); }

async function guardar(siguiente, forzar){
  const vals={}, errores=[];
  CONFIG.campos.forEach(c=>{
    const el=document.getElementById('f_'+c.k); if(!el){ vals[c.k]=undefined; return; }
    const raw=el.value.trim();
    if(raw===''){ vals[c.k]=null; return; }
    const n=num(raw);
    if(isNaN(n)) errores.push(`<b>${c.label}</b>: «${esc(raw)}» no es un número.`);
    else if(n<0) errores.push(`<b>${c.label}</b> no puede ser negativa.`);
    else if(n>1000) errores.push(`<b>${c.label}</b>: ${fN(n)} es imposible.`);
    else vals[c.k]=n;
  });
  const com=document.getElementById('f_com').value.trim(), enf=S._enf||'No';
  const hayAlgo = CONFIG.campos.some(c=>vals[c.k]!=null) || enf==='Sí' || com;
  if(!errores.length && !hayAlgo) errores.push('No has apuntado ninguna medida.');
  if(errores.length){ modal(`<h3>Revisa estos datos</h3><ul>${errores.map(x=>'<li>'+x+'</li>').join('')}</ul><button class="btn pri" data-act="cerrar">Corregir</button>`); return; }
  if(!forzar){
    const av=revisar(vals, S._ant, S.fecha);
    if(av.length){ S._next=siguiente; modal(`<h3>Comprueba estos valores</h3><ul>${av.map(x=>'<li>'+x+'</li>').join('')}</ul>
      <button class="btn pri" data-act="cerrar">Corregir</button><button class="btn sec mt" data-act="forzar">Está bien, guardar igualmente</button>`); return; }
  }
  const et=S.etiqueta, [viv,zona]=et.split(' · '), p=plantasDe(et).find(x=>x.id===S.planta)||{sector:''};
  let {rec}=medicionDe(et,S.planta,S.fecha);
  if(!rec){ rec={uuid:uuid(), id:S.planta, vivero:viv, zona, etiqueta:et, campana:cfg.campana, fecha:S.fecha, dispositivo}; records.push(rec); }
  CONFIG.campos.forEach(c=>{ if(vals[c.k]!==undefined) rec[c.k]=vals[c.k]; });
  Object.assign(rec, { sector:p.sector, anio:Number(S.fecha.slice(0,4)), fecha_injerto:(zonaInfo[cfg.campana+'|'+et]||{}).fechaInjerto||'',
    enfermedad:enf, comentarios:com, medidor:cfg.nombre, actualizado:new Date().toISOString(), borrado:0, synced:false });
  try{ await Store.put([rec]); }catch(err){ modal(`<h3>No se ha podido guardar</h3><p>${esc(err)}</p><button class="btn pri" data-act="cerrar">Vale</button>`); return; }
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  toast('✓ Guardado en el móvil');
  programarSync();
  if(siguiente){
    const pl=plantasDe(et), i=pl.findIndex(x=>x.id===S.planta);
    const sig=[...pl.slice(i+1),...pl.slice(0,i)].find(x=>!medicionDe(et,x.id,S.fecha).rec);
    if(sig){ S.planta=sig.id; const g=(String(sig.id).match(/^(F\d+)Z/i)||[])[1]; if(S.grupo&&g) S.grupo=g; render(); scrollTo(0,0); return; }
    toast('✓ Zona completa');
  }
  S.view='medir'; S.planta=null; render(); scrollTo(0,0);
}

function pintarEstado(){
  const el=document.getElementById('estado'), tx=document.getElementById('estadoTxt');
  const pend=records.filter(r=>!r.synced&&!r.historico).length, total=vivos().filter(r=>!r.historico).length;

  el.className=''; let t;
  if(!cfg.url){ t=`${total} ${total===1?'medición guardada':'mediciones guardadas'} en este móvil`; if(!on) el.className='off'; }
  else if(sync.estado==='run') t='Sincronizando…';
  else if(!on){ el.className='off'; t=pend?`Sin conexión · ${pend} ${pend===1?'guardada, se enviará sola':'guardadas, se enviarán solas'}`:'Sin conexión · todo enviado'; }
  else if(sync.error && pend){ el.className='err'; t=`${pend} sin enviar · se reintentará`; }
  else t = pend ? `${pend} pendientes de enviar` : '✓ Todo enviado a Google Sheets';
  tx.textContent=t;
  document.getElementById('navBadge').innerHTML = cfg.url&&pend ? `<span class="badge">${pend}</span>` : '';
}
function conTiempo(url, opt, ms){
  const ac=new AbortController(); const t=setTimeout(()=>ac.abort(), ms);
  return fetch(url, Object.assign({signal:ac.signal, redirect:'follow'}, opt)).finally(()=>clearTimeout(t));
}
let syncTimer=null;
function programarSync(){ clearTimeout(syncTimer); syncTimer=setTimeout(()=>sincronizar(false), 1500); pintarEstado(); }
const CAMPOS_SHEET=['uuid','id','vivero','zona','campana','etiqueta','sector','anio','fecha_injerto','fecha','altura_ucb','altura_lign','diametro70','altura_injerto','enfermedad','comentarios','medidor','dispositivo','actualizado','borrado'];
async function sincronizar(manual, prueba){
  if(!cfg.url){ if(manual) toast('Configura Google Sheets en Ajustes'); return; }
  if(sync.estado==='run') return;
  if(!navigator.onLine && !manual){ pintarEstado(); return; }
  sync.estado='run'; sync.error=''; if(S.view==='datos') render(); else pintarEstado();
  let hubo=0;
  try{
    // 1) enviar lo pendiente
    const pend=records.filter(r=>!r.synced && !r.historico);
    let enviados=0;
    for(let i=0;i<pend.length;i+=200){
      const lote=pend.slice(i,i+200);
      const snap=new Map(lote.map(r=>[r.uuid,r.actualizado]));
      const res=await conTiempo(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({clave:cfg.clave, records:lote.map(r=>{ const o={}; CAMPOS_SHEET.forEach(k=>o[k]=r[k]??''); return o; })})},30000);
      const j=await res.json();
      if(!j.ok) throw new Error(j.error||'Error del servidor');
      const ok=new Set(j.guardados||[]);
      const cambiados=lote.filter(r=>ok.has(r.uuid) && snap.get(r.uuid)===r.actualizado);
      cambiados.forEach(r=>r.synced=true); enviados+=cambiados.length;
      await Store.put(cambiados);
    }
    // 2) recibir lo de los compañeros (como mucho cada 5 min, salvo si se pide)
    let recibidos=0;
    if(manual || Date.now()-sync.ultimaBajada>5*60000){
      const u=cfg.url+(cfg.url.includes('?')?'&':'?')+'clave='+encodeURIComponent(cfg.clave)+'&campana='+encodeURIComponent(cfg.campana);
      const j=await (await conTiempo(u,{},30000)).json();
      if(!j.ok) throw new Error(j.error||'Error del servidor');
      recibidos=await fusionar(j.records||[]); hubo=recibidos;
      sync.ultimaBajada=Date.now();
    }
    sync.ultima=Date.now(); LS.set('ultimaSync',sync.ultima);
    if(prueba) modal(`<h3>✓ Conexión correcta</h3><p>Google Sheets responde. ${enviados} enviadas, ${recibidos} recibidas.</p><button class="btn pri" data-act="cerrar">Vale</button>`);
    else if(manual) toast(`✓ ${enviados} enviadas · ${recibidos} recibidas`);
  }catch(err){
    sync.error = err.name==='AbortError' ? 'La conexión tarda demasiado' : (/fetch|network|load/i.test(String(err)) ? 'Sin conexión con Google Sheets' : String(err.message||err));
    if(prueba) modal(`<h3>No conecta</h3><p>${esc(sync.error)}</p><p class="muted">Revisa la dirección del script, la clave y que el script esté implantado con acceso «Cualquier usuario».</p><button class="btn pri" data-act="cerrar">Vale</button>`);
    else if(manual) toast('No se ha podido sincronizar: '+sync.error);
  }finally{
    sync.estado='idle';
    if(S.view==='datos' || (S.view==='medir' && hubo)) render(); else pintarEstado();
  }
}
async function fusionar(lista){
  const idx=new Map(records.map(r=>[r.uuid,r])), cambiar=[];
  lista.forEach(o=>{
    if(!o.uuid) return;
    const r={}; CAMPOS_SHEET.forEach(k=>r[k]=o[k]);
    r.id=String(r.id).trim(); r.zona=String(r.zona); r.campana=String(r.campana); r.fecha=String(r.fecha).slice(0,10);
    r.fecha_injerto=r.fecha_injerto?String(r.fecha_injerto).slice(0,10):'';
    CONFIG.campos.forEach(c=>{ r[c.k] = (r[c.k]===''||r[c.k]==null) ? null : num(r[c.k]); });
    r.borrado = Number(r.borrado)?1:0; r.synced=true; r.actualizado=String(r.actualizado||'');
    const l=idx.get(r.uuid);
    if(!l){ records.push(r); idx.set(r.uuid,r); cambiar.push(r); }
    else if(l.synced && r.actualizado>(l.actualizado||'')){ Object.assign(l,r); cambiar.push(l); }
  });
  if(cambiar.length) await Store.put(cambiar);
  return cambiar.length;
}

function serial(s){ return (dUTC(s)-Date.UTC(1899,11,30))/86400000; }
function formulas(r, ini){
  const [y,m,d]=ini.split('-').map(Number), D=`DATE(${y},${m},${d})`;
  return {
    B:`IF(OR(A${r}="",I${r}=""),"",A${r}&"|"&I${r})`,

    J:`IF(ISNUMBER(M${r}),INT(M${r})-WEEKDAY(M${r},2)+1,"")`,
    K:`IF(ISNUMBER(M${r}),INT((M${r}-${D})/7)+2,"")`,
    O:`IF(OR(A${r}="",NOT(ISNUMBER(M${r})),NOT(ISNUMBER(N${r}))),"",IF(COUNTIFS(A:A,A${r},C:C,C${r}&"",D:D,D${r},E:E,E${r},J:J,J${r}-7,N:N,"<>")=1,N${r}-SUMIFS(N:N,A:A,A${r},C:C,C${r}&"",D:D,D${r},E:E,E${r},J:J,J${r}-7),""))`,
    S:`IF(OR(A${r}="",I${r}="",R${r}=""),"",IFERROR(R${r}-INDEX(R:R,MATCH(A${r}&"|S"&(VALUE(SUBSTITUTE(I${r},"S",""))-1),B:B,0)),""))`,
  };
}
function xmlEsc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function hojaXML(filas){

    if(c.d) return `<c r="${ref}" s="1"><v>${serial(c.d)}</v></c>`;
    if(typeof c==='number') return `<c r="${ref}"><v>${c}</v></c>`;

  };
  let x=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols><col min="1" max="1" width="16" customWidth="1"/><col min="2" max="2" width="18" customWidth="1"/><col min="3" max="12" width="11" customWidth="1"/><col min="13" max="20" width="13" customWidth="1"/><col min="21" max="21" width="30" customWidth="1"/></cols><sheetData>`;
  x+=`<row r="1">`+CAB.map((h,i)=>celda(L[i],1,{t:h,h:1})).join('')+`</row>`;
  filas.forEach((rec,i)=>{

    const sec=n(rec.sector);
    const vals=[rec.id,{f:F.B},rec.vivero,rec.zona,rec.campana,rec.etiqueta,sec!=null?sec:(rec.sector||null),Number(rec.fecha.slice(0,4)),
      {f:F.I},{f:F.J,s:1},{f:F.K},rec.fecha_injerto?{d:rec.fecha_injerto}:null,{d:rec.fecha},
      n(rec.altura_ucb),{f:F.O},n(rec.altura_lign),n(rec.diametro70),n(rec.altura_injerto),{f:F.S},rec.enfermedad||'No',rec.comentarios||null];
    x+=`<row r="${r}">`+vals.map((v,j)=>celda(L[j],r,v)).join('')+`</row>`;

}
function crc32(u8){
  let t=crc32.t; if(!t){ t=crc32.t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } }

function zip(files){

  });
  const tam=central.reduce((a,b)=>a+b.length,0), fin=new DataView(new ArrayBuffer(22));
  fin.setUint32(0,0x06054b50,true); fin.setUint16(8,files.length,true); fin.setUint16(10,files.length,true); fin.setUint32(12,tam,true); fin.setUint32(16,off,true);
  return new Blob([...partes,...central,new Uint8Array(fin.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
